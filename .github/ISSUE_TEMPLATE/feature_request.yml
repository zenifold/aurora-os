name: Feature request
description: Suggest an idea for Aura
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sales
        - Delivery
        - Ops
        - Knowledge (notes/meetings/docs)
        - Platform / infra
        - Other
