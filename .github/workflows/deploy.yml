name: Deploy

# Deploys aurora-app.work from this repo. The Worker name and custom domain
# live in wrangler.jsonc; this workflow only supplies build-time config and
# credentials.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race — a later push should win, not interleave.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # VITE_* vars are inlined into the bundle at build time (see the `define`
      # block in vite.config.ts), so they must be present HERE — setting them as
      # Worker secrets would have no effect on client code.
      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_BRAND_APP_NAME: ${{ vars.VITE_BRAND_APP_NAME }}
          VITE_BRAND_SUPPORT_EMAIL: ${{ vars.VITE_BRAND_SUPPORT_EMAIL }}

      # Runtime secrets (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
      # OPENROUTER_API_KEY) are NOT set here. They live in Cloudflare as Worker
      # secrets via `wrangler secret put`, and `wrangler deploy` leaves them
      # alone. Do not duplicate them into this workflow.
      - name: Deploy to Cloudflare Workers
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
