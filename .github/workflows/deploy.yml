name: Deploy

# Deploys aurora-app.work from this repo. The Worker name and custom domain
# live in wrangler.jsonc; this workflow only supplies build-time config and
# credentials.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race — a later push should win, not interleave.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned so a transient GitHub-releases hiccup resolving `latest`
          # cannot fail a production deploy. Bump deliberately.
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # VITE_* vars are inlined into the bundle at build time (see the `define`
      # block in vite.config.ts), so they must be present HERE — setting them as
      # Worker secrets would have no effect on client code.
      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_BRAND_APP_NAME: ${{ vars.VITE_BRAND_APP_NAME }}
          VITE_BRAND_SUPPORT_EMAIL: ${{ vars.VITE_BRAND_SUPPORT_EMAIL }}

      # Cloudflare rejects a Worker over 3 MiB gzipped, but only at upload — as
      # `code: 10027`, after a full build, with no hint about the cause. Check it
      # here so the failure names the problem and the fix. Excalidraw's graph
      # (mermaid, cytoscape, katex) took this from 2.07 to 4.89 MiB once already.
      - name: Check worker size against Cloudflare's limit
        run: |
          node -e "
          const fs=require('fs'),path=require('path'),zlib=require('zlib');
          let total=0;
          (function walk(d){
            for (const e of fs.readdirSync(d,{withFileTypes:true})) {
              const p=path.join(d,e.name);
              if (e.isDirectory()) walk(p);
              else if (e.name.endsWith('.js')) total+=zlib.gzipSync(fs.readFileSync(p)).length;
            }
          })('dist/server');
          const MiB=1048576, limit=3*MiB, warn=2.6*MiB;
          const mb=n=>(n/MiB).toFixed(2)+' MiB';
          console.log('worker gzipped: '+mb(total)+'  (limit '+mb(limit)+')');
          if (total>=limit) {
            console.error('::error::Worker is '+mb(total)+', over Cloudflare-s 3 MiB free-plan limit. Something client-only is being bundled into the SSR graph — add it to CLIENT_ONLY_IN_SSR in vite.config.ts, or upgrade to Workers Paid for 10 MiB.');
            process.exit(1);
          }
          if (total>=warn) {
            console.log('::warning::Worker is '+mb(total)+', within '+mb(limit-total)+' of the 3 MiB limit.');
          }
          "

      # Runtime secrets (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
      # OPENROUTER_API_KEY) are NOT set here. They live in Cloudflare as Worker
      # secrets via `wrangler secret put`, and `wrangler deploy` leaves them
      # alone. Do not duplicate them into this workflow.
      - name: Deploy to Cloudflare Workers
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
