name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned rather than `latest`: setup-bun caches per version, and
          # resolving `latest` re-downloads the release every run — which has
          # already failed CI once with a "socket hang up" from GitHub releases.
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      # Blocking. Catches real type breakage and currently passes clean.
      - run: bun run typecheck

      # Non-blocking on purpose. The tree carries ~17k pre-existing lint errors
      # (overwhelmingly @typescript-eslint/no-explicit-any), so a blocking lint
      # step can never pass and would keep CI permanently red — which hides
      # genuine failures instead of surfacing them. Left visible so the count
      # can be driven down, then flip this back to blocking.
      - run: bun run lint
        continue-on-error: true

      - run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy
          VITE_SUPABASE_PROJECT_ID: example

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e:install

      # The smoke tests run against the built worker, and this job does not
      # share a filesystem with the `build` job — without this step
      # dist/ is absent and playwright's webServer times out. VITE_* values are
      # inlined here at build time, which is why the dummies live on this step.
      - run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy
          VITE_SUPABASE_PROJECT_ID: example

      - run: bun run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
