<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aura — Offline</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b12; color: #e9e9f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
      .wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 24px; text-align: center; }
      h1 { background: linear-gradient(90deg, #a78bfa, #f472b6); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 40px; margin: 0 0 8px; }
      p { color: #a1a1aa; max-width: 360px; line-height: 1.5; }
      button { margin-top: 24px; background: linear-gradient(90deg, #a78bfa, #f472b6); color: white; border: 0; padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>You're offline</h1>
      <p>Your tasks and recent data are still available in the app. Reconnect to sync changes.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
