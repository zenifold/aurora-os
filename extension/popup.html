<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Aura Quick Capture</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 380px;
        height: 600px;
        background: #0b0b12;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      iframe {
        width: 380px;
        height: 600px;
        border: 0;
        display: block;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #888;
        font-size: 13px;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading Aura…</div>
    <iframe id="app" src="about:blank" allow="clipboard-write"></iframe>
    <script src="popup.js"></script>
  </body>
</html>
