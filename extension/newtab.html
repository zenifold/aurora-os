<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aura — New Tab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; min-height: 100%;
        background: #0b0b12;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .bg {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
          radial-gradient(ellipse at top, rgba(168,85,247,0.18), transparent 60%),
          radial-gradient(ellipse at bottom right, rgba(236,72,153,0.12), transparent 60%);
      }
      .shell { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 56px 32px 80px; }
      header {
        display: flex; align-items: center; gap: 16px; margin-bottom: 36px;
      }
      .brand {
        font-size: 28px; font-weight: 700; letter-spacing: -0.02em;
        background: linear-gradient(135deg, #a855f7, #ec4899);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .greet { color: rgba(255,255,255,0.65); font-size: 14px; margin-left: auto; }
      .clock { font-variant-numeric: tabular-nums; font-weight: 600; color: #fff; }

      form.search {
        position: relative; margin-bottom: 40px;
      }
      input.q {
        width: 100%; padding: 18px 22px 18px 56px;
        font-size: 16px; color: #fff;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px; outline: none;
        transition: border-color .15s, background .15s;
      }
      input.q:focus { border-color: rgba(168,85,247,0.5); background: rgba(255,255,255,0.06); }
      .search svg {
        position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
        opacity: 0.5;
      }
      .hint { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4); font-size: 12px; }
      .hint kbd {
        background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
        border-radius: 4px; padding: 1px 6px; font-size: 11px; font-family: inherit;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }
      @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

      .card {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 16px;
        padding: 22px;
        min-height: 280px;
        display: flex; flex-direction: column;
      }
      .card h2 {
        margin: 0 0 16px; font-size: 13px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.08em;
        color: rgba(255,255,255,0.55);
        display: flex; align-items: center; gap: 8px;
      }
      .dot { width: 6px; height: 6px; border-radius: 50%; }
      .dot.purple { background: #a855f7; box-shadow: 0 0 8px rgba(168,85,247,0.6); }
      .dot.pink { background: #ec4899; box-shadow: 0 0 8px rgba(236,72,153,0.6); }
      .dot.amber { background: #f59e0b; box-shadow: 0 0 8px rgba(245,158,11,0.6); }

      .item {
        padding: 11px 12px; border-radius: 10px;
        display: flex; align-items: center; gap: 10px;
        text-decoration: none; color: #fff;
        font-size: 13.5px;
        border: 1px solid transparent;
      }
      .item:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.08); }
      .item .meta { margin-left: auto; color: rgba(255,255,255,0.45); font-size: 12px; font-variant-numeric: tabular-nums; }
      .item .tag {
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
        padding: 2px 7px; border-radius: 999px;
        background: rgba(168,85,247,0.18); color: #d8b4fe;
      }

      .empty {
        flex: 1; display: flex; align-items: center; justify-content: center;
        color: rgba(255,255,255,0.35); font-size: 13px; text-align: center; padding: 20px;
      }

      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 36px; }
      a.btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 10px 18px; border-radius: 999px;
        text-decoration: none; font-size: 13px; font-weight: 500;
      }
      .primary { background: linear-gradient(135deg, #a855f7, #ec4899); color: #fff; }
      .ghost { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.08); }
      a.btn:hover { opacity: 0.92; }

      footer { margin-top: 48px; color: rgba(255,255,255,0.35); font-size: 12px; text-align: center; }
      footer kbd { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 4px; padding: 1px 6px; font-size: 11px; font-family: inherit; }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="shell">
      <header>
        <div class="brand">✦ Aura</div>
        <div class="greet">
          <span id="greeting">Good day</span> · <span class="clock" id="clock">—</span>
        </div>
      </header>

      <form class="search" id="searchForm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <input class="q" id="q" placeholder="Search projects, tasks, docs, deals…" autofocus />
        <span class="hint"><kbd>aura</kbd> in URL bar works too</span>
      </form>

      <div class="grid">
        <section class="card">
          <h2><span class="dot purple"></span> Inbox</h2>
          <div id="inbox" class="list">
            <div class="empty">Loading your unread mentions…</div>
          </div>
        </section>

        <section class="card">
          <h2><span class="dot pink"></span> Today's meetings</h2>
          <div id="meetings" class="list">
            <div class="empty">No meetings scheduled.</div>
          </div>
        </section>

        <section class="card">
          <h2><span class="dot amber"></span> Due this week</h2>
          <div id="tasks" class="list">
            <div class="empty">Loading your tasks…</div>
          </div>
        </section>
      </div>

      <div class="actions">
        <a class="btn primary" href="http://localhost:8080/app/my-tasks">Open My Tasks</a>
        <a class="btn ghost" href="http://localhost:8080/app">Dashboard</a>
        <a class="btn ghost" href="http://localhost:8080/app/meetings">Meetings</a>
        <a class="btn ghost" href="http://localhost:8080/app/inbox">Inbox</a>
      </div>

      <footer>
        Quick capture <kbd>⌘⇧A</kbd> · Toggle sidebar <kbd>⌘⇧L</kbd> · Type <kbd>aura</kbd> in URL bar to search
      </footer>
    </div>

    <script src="newtab.js"></script>
  </body>
</html>
